<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
  <!-- Total Trades Metric Card -->
  <div
    class="summary-card bg-slate-800/80 backdrop-blur-sm rounded-2xl p-5 border border-slate-700/60 shadow-md transition-gpu duration-200 ease-out hover:-translate-y-1 hover:shadow-xl hover:border-slate-600 flex items-center justify-between"
  >
    <div>
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-1">
        Total Executions
      </span>
      <span class="text-3xl font-extrabold text-white tracking-tight">
        {{ totalTrades() }}
      </span>
    </div>
    <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
    </div>
  </div>

  <!-- Win Rate Metric Card -->
  <div
    class="summary-card bg-slate-800/80 backdrop-blur-sm rounded-2xl p-5 border border-slate-700/60 shadow-md transition-gpu duration-200 ease-out hover:-translate-y-1 hover:shadow-xl hover:border-slate-600 flex items-center justify-between"
  >
    <div>
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-1">
        Win Rate
      </span>
      <span
        class="text-3xl font-extrabold tracking-tight"
        [class.text-emerald-400]="winRate() >= 0.5"
        [class.text-amber-400]="winRate() > 0 && winRate() < 0.5"
        [class.text-slate-300]="winRate() === 0"
      >
        {{ winRate() | percent:'1.0-1' }}
      </span>
    </div>
    <div
      class="w-12 h-12 rounded-xl border flex items-center justify-center shrink-0"
      [class.bg-emerald-500\/10]="winRate() >= 0.5"
      [class.text-emerald-400]="winRate() >= 0.5"
      [class.border-emerald-500\/20]="winRate() >= 0.5"
      [class.bg-amber-500\/10]="winRate() < 0.5"
      [class.text-amber-400]="winRate() < 0.5"
      [class.border-amber-500\/20]="winRate() < 0.5"
    >
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
    </div>
  </div>

  <!-- Net PnL Metric Card -->
  <div
    class="summary-card bg-slate-800/80 backdrop-blur-sm rounded-2xl p-5 border border-slate-700/60 shadow-md transition-gpu duration-200 ease-out hover:-translate-y-1 hover:shadow-xl hover:border-slate-600 flex items-center justify-between"
  >
    <div>
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-1">
        Net PnL
      </span>
      <span
        class="text-3xl font-extrabold tracking-tight"
        [class.text-emerald-400]="totalPnL() > 0"
        [class.text-rose-400]="totalPnL() < 0"
        [class.text-slate-300]="totalPnL() === 0"
      >
        {{ totalPnL() | currency:'USD':'symbol':'1.2-2' }}
      </span>
    </div>
    <div
      class="w-12 h-12 rounded-xl border flex items-center justify-center shrink-0"
      [class.bg-emerald-500\/10]="totalPnL() > 0"
      [class.text-emerald-400]="totalPnL() > 0"
      [class.border-emerald-500\/20]="totalPnL() > 0"
      [class.bg-rose-500\/10]="totalPnL() < 0"
      [class.text-rose-400]="totalPnL() < 0"
      [class.border-rose-500\/20]="totalPnL() < 0"
      [class.bg-slate-700\/40]="totalPnL() === 0"
      [class.text-slate-400]="totalPnL() === 0"
      [class.border-slate-600]="totalPnL() === 0"
    >
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
  </div>
</div>
